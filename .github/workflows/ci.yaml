# Builds and tests every pull request, and main after each merge: two jobs, run in parallel on fresh runners.
# On main, the image job also pushes the images it smoke-tested, and a third job deploys them to Azure (ADR-0007).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The automatic GITHUB_TOKEN can only read the repo: nothing here needs to write.
permissions:
  contents: read

# A newer push to the same PR cancels the run still in progress for it. On main, runs queue instead: cancelling one
# could stop a deploy between the migrations and the server update. (Only one run waits; a newer one replaces it.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where main deploys to. Two identities sign in to Azure (ADR-0010): the image job pushes as id-todo-push, which Entra
# trusts for this repo's main and which can only push images; Deploy deploys as id-todo-deploy, which Entra trusts only
# for the production environment. Their IDs are repository variables, not secrets: a token GitHub signed for this repo
# is what gets in (docs/checklist.md, E1 and E4).
env:
  REGISTRY: crtodoac1.azurecr.io
  RESOURCE_GROUP: rg-todo-prod

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The default is 6 hours; a hung run would use up the month's minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave the token in the clone's Git config for later steps.
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Warnings are errors (Directory.Build.props), so this also fails on vulnerable NuGet packages.
      - run: dotnet build -c Release

      # Fails when an entity changed without a migration to match (ADR-0004). Before the tests: it takes seconds and
      # names the problem, while the tests would all fail on it with the same error (Migrate refuses pending changes).
      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Todo.Api --configuration Release --no-build

      # The integration tests start SQL Server with Testcontainers, using the runner's Docker.
      - run: dotnet test -c Release --no-build

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, to push the images on main. Permissions can't depend on the event,
      # so PR runs have it too: their token's subject is repo:...:pull_request, which no federated credential
      # accepts, so they can't sign in to Azure.
      id-token: write
    env:
      # For the throwaway SQL Server that lives and dies on this runner, so not a secret.
      MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-Pw1!
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same stack as `docker compose up` locally: both images built, SQL Server healthy,
      # migrations applied by the bundle, then the server started.
      - name: Start the app with Docker Compose
        run: docker compose up -d --build --wait api

      # The server is running but may still be starting up, so the first request retries.
      - name: Smoke test
        run: |
          check() {
            local path=$1 expected=$2 status
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 10 --retry-delay 2 --retry-all-errors "http://localhost:8080$path")
            echo "$path -> $status (expected $expected)"
            [ "$status" = "$expected" ]
          }
          # A prerendered page queries the database, so this also proves the migrations ran.
          check / 200
          # Missing from the published app before RequiresAspNetWebAssets was set.
          check /_framework/blazor.web.js 200
          check /api/lists 200
          check /no-such-page 404

      # Build once: on main, push the images that just passed, tagged with the commit (never rebuilt for the deploy).
      # As id-todo-push: AcrPush on the registry, nothing else.
      - name: Sign in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PUSH_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push the images
        if: github.event_name == 'push'
        run: |
          az acr login --name "${REGISTRY%%.*}"
          for image in todo-api todo-migrate; do
            docker tag "$image" "$REGISTRY/$image:$GITHUB_SHA"
            docker push "$REGISTRY/$image:$GITHUB_SHA"
          done

      - name: Show container logs
        if: failure()
        run: docker compose logs

  deploy:
    name: Deploy
    # Main only, and only once both CI jobs have passed: the tests, and the smoke test of the images it deploys.
    if: github.event_name == 'push'
    needs: [build-test, image]
    # GitHub runs this job only if production's rules allow it (only main may deploy), records it as a deployment,
    # and gives it the token subject repo:...:environment:production, the only one id-todo-deploy trusts.
    environment: production
    runs-on: ubuntu-latest
    # The migration job's own limit is 10 minutes; the server update takes a minute or two.
    timeout-minutes: 20
    permissions:
      id-token: write
    env:
      MIGRATION_JOB: caj-todo-migrate
      SERVER_APP: ca-todo-api
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Migrations first, while the old server still runs (each migration works with the old code: ADR-0004).
      # job update changes only the image in the job's definition; job start --image would replace the whole
      # container and drop its connection string (docs/checklist.md, E1.6).
      - name: Run the migrations
        run: |
          az containerapp job update --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/todo-migrate:$GITHUB_SHA" --output none
          execution=$(az containerapp job start --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          echo "Started $execution"
          # Up to 11 minutes, a little over the job's own 10-minute limit.
          for _ in $(seq 66); do
            sleep 10
            status=$(az containerapp job execution show --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$execution" --query properties.status --output tsv)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration $execution: $status. The server was not updated. Its output is in Log Analytics, a few minutes late:"
                echo "ContainerAppConsoleLogs_CL | where ContainerJobName_s == \"$MIGRATION_JOB\" | order by TimeGenerated asc"
                exit 1 ;;
            esac
          done
          echo "::error::Migration $execution still not finished after 11 minutes. The server was not updated."
          exit 1

      # A new revision; it takes the traffic once healthy, and the old one keeps serving until then.
      - name: Deploy the server
        run: |
          az containerapp update --name "$SERVER_APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY/todo-api:$GITHUB_SHA" --output none
          revision=$(az containerapp show --name "$SERVER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.latestRevisionName --output tsv)
          echo "Created $revision"
          # A new revision reports no health while it activates, then Healthy (about a minute on the first deploy).
          ready=false
          for _ in $(seq 30); do
            sleep 10
            health=$(az containerapp revision show --name "$SERVER_APP" --resource-group "$RESOURCE_GROUP" \
              --revision "$revision" --query properties.healthState --output tsv)
            echo "$(date -u +%H:%M:%S) $health"
            case "$health" in
              Healthy) ready=true; break ;;
              Unhealthy) break ;;
            esac
          done
          az containerapp revision list --name "$SERVER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "[].{revision:name, image:properties.template.containers[0].image, health:properties.healthState, running:properties.runningState, traffic:properties.trafficWeight}" \
            --output table
          if [ "$ready" != true ]; then
            echo "::error::$revision is not healthy (last: ${health:-none}). The previous revision keeps serving until it is."
            exit 1
          fi
